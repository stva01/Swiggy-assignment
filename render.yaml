services:
  # 1. FastAPI Python Backend Service
  - type: web
    name: post-offer-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: dev/backend
    buildCommand: pip install -r requirements.txt && python -m app.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MAIN_MODEL
        value: openai/gpt-oss-20b
      - key: PROMPT_GUARD_REQUIRED
        value: "false"

  # 2. React / Vite Frontend Web Service
  - type: web
    name: post-offer-frontend
    runtime: node
    plan: free
    region: singapore
    rootDir: dev
    buildCommand: pnpm install && pnpm run build
    startCommand: node dist/index.js
    envVars:
      - key: BACKEND_URL
        value: https://post-offer-backend.onrender.com
      - key: VITE_API_URL
        value: https://post-offer-backend.onrender.com
      - key: VITE_API_BASE_URL
        value: https://post-offer-backend.onrender.com
